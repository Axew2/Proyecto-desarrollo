<body class="login">

    <main>
        <section id = "login-section">
            <h2>Inicie sesión en Regi Music</h2>
            <p>Ingrese sus datos para ingresar a tu cuenta.</p>

            <!-- Está GET y POST, en el slide 2 del profe el POST indica que 
            debemos usar POST, ya que este sirve pa' crear, enviar y registrar. -->

            <!-- Estuve viendo justamente el coso de formularios en profundidad pa hacer este
            -Claudito.      -->
            <form action = "#" method = "post">
                <p>
                    <label for = "correo"> Correo Electrónico: </label><br>
                    <input type = "email" id = "correo" name = "correo" required autocomplete="email">
                </p>
                <p>
                    <label for = "password"> Contraseña: </label><br>
                    <input type = "password" id = "password" name = "password" required minlength="6" autocomplete="current-password">
                </p>
                <button type = "submit"> Iniciar Sesión </button>
            </form>
        </section>
    </main>

    <footer>
